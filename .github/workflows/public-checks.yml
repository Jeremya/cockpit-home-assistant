name: Public checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "1"
  EXPO_NO_DOTENV: "1"
  EXPO_OFFLINE: "1"
  COCKPIT_PLAN_FILE: src/spatial/sample-plan.json

jobs:
  functional:
    name: Tests, protocol and Android JS
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            patches/*.patch
      - name: Isolate Expo transform cache
        run: echo "TMPDIR=$(mktemp -d "$RUNNER_TEMP/maurice-cache-XXXXXX")" >> "$GITHUB_ENV"
      - run: npm ci --include=dev --no-audit --no-fund
      - run: npm run check:public-inputs
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test -- --watch=false
      - run: npm run test:tooling
      - run: npm run proof:dependencies
      - run: npm run proof:protocol
      - run: npm run export:android -- --source-maps
      - run: npm run check:runtime-dependencies -- dist android
      - name: Check public provenance after exports
        run: npm run check:public-inputs
      - name: Check tracked files remain unchanged
        run: git diff --exit-code

  ui:
    name: Public UI mobile + desktop
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            patches/*.patch
      - run: npm ci --include=dev --no-audit --no-fund
      - run: npm run check:public-inputs
      - run: npx --no-install playwright install --with-deps chromium
      - run: npm run check:ui
      - name: Bounded public captures and report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: public-ui
          path: |
            artifacts/ui/report.json
            artifacts/ui/home-320.png
            artifacts/ui/home-430.png
            artifacts/ui/home-768.png
            artifacts/ui/home-1440.png
            artifacts/ui/plan-320.png
            artifacts/ui/plan-430.png
            artifacts/ui/plan-768.png
            artifacts/ui/plan-1440.png
            artifacts/ui/control-320.png
            artifacts/ui/control-430.png
            artifacts/ui/control-768.png
            artifacts/ui/control-1440.png
            artifacts/ui/failure.png
          retention-days: 7
          if-no-files-found: warn

  spatial:
    name: Public 3D web lifecycle (headless)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            patches/*.patch
      - run: npm ci --include=dev --no-audit --no-fund
      - run: npm run check:public-inputs
      - run: npx --no-install playwright install --with-deps chromium
      # Functional only: software WebGL in CI is not a GPU performance proof.
      - run: npm run check:spatial-ui
      - name: Bounded public 3D captures and report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: public-spatial-ui
          path: |
            artifacts/spatial-ui/report.json
            artifacts/spatial-ui/home-3d-1440.png
            artifacts/spatial-ui/fallback-1440.png
            artifacts/spatial-ui/failure.png
          retention-days: 7
          if-no-files-found: warn

  detail-panel:
    name: Public detail panel and navigation (headless)
    runs-on: ubuntu-24.04
    # The runner bounds itself at 20 minutes.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            patches/*.patch
      - run: npm ci --include=dev --no-audit --no-fund
      - run: npm run check:public-inputs
      - run: npx --no-install playwright install --with-deps chromium
      - run: npm run check:detail-panel
      - name: Bounded public panel captures and report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: public-detail-panel
          path: |
            artifacts/detail-panel/report.json
            artifacts/detail-panel/panel-430.png
            artifacts/detail-panel/panel-1024.png
            artifacts/detail-panel/panel-1280.png
            artifacts/detail-panel/panel-1440.png
            artifacts/detail-panel/panel-zoom200.png
          retention-days: 7
          if-no-files-found: warn

  web-auth:
    name: Public browser sign-in (headless)
    runs-on: ubuntu-24.04
    # The runner bounds itself at 20 minutes.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            patches/*.patch
      - run: npm ci --include=dev --no-audit --no-fund
      - run: npm run check:public-inputs
      - run: npx --no-install playwright install --with-deps chromium
      # Public fixture users and tokens only; no household instance.
      - run: npm run check:web-auth
      - name: Bounded public sign-in captures and report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: public-web-auth
          path: |
            artifacts/web-auth/report.json
            artifacts/web-auth/settings-remembered.png
            artifacts/web-auth/signed-out-elsewhere.png
            artifacts/web-auth/a03-signed-out.png
          retention-days: 7
          if-no-files-found: warn
